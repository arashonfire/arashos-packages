# AUR packages rebuilt into the ArashOS repo (D-1.1), in build order.
# Each line: <package> <reviewed AUR git commit> [<upstream commit>]. Review
# the PKGBUILD diff before bumping a commit: AUR recipes are user-submitted.
# A -git package also pins the upstream commit it's built from (the full
# hash; packages/pin-source.sh), or it would build upstream's latest: review
# upstream's changes before bumping that one too.
# Reviewed 2026-10-10: sources are the projects' official GitHub releases (or
# git for -git packages); quickshell-git adds a Qt-compat check hook.
# Reviewed 2026-10-12: paru builds the official GitHub release with cargo
# (prepare() updates its alpm crates to match the system's libalpm). Rebuild it
# when Arch bumps libalpm's soname, or it stops starting.
